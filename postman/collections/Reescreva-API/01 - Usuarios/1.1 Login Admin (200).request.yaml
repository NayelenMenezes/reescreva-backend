$kind: http-request
url: http://localhost:8080/api/usuarios/login
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@reescreva.com",
      "senha": "admin123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK - Login realizado', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
