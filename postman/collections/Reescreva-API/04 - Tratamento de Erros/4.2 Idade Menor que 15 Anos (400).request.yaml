$kind: http-request
url: http://localhost:8080/api/indicacoes
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nomeInteressado": "Menor Teste",
      "telefone": "74988887777",
      "idade": 12
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
