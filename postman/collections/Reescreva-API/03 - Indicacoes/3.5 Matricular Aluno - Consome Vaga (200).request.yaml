$kind: http-request
url: http://localhost:8080/api/indicacoes/{{indicacaoId}}/status?status=MATRICULADO
method: PATCH
queryParams:
  status: MATRICULADO
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 OK - Matriculado', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().status).to.eql('MATRICULADO');
      });
    language: text/javascript
order: 5000
